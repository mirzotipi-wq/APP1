name: KeyAndFill
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  LightingCore:
    path: .
targets:
  KeyAndFill:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: LightingCore
        product: LightingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.keyandfill
        SWIFT_VERSION: "5.0"
        MTL_FAST_MATH: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Key & Fill"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access lets you place your lighting plan in the room with AR. Camera frames stay on your device."
        KEYFILL_PRO_PRODUCT_ID: ""
        INFOPLIST_KEY_KEYFILL_PRO_PRODUCT_ID: "$(KEYFILL_PRO_PRODUCT_ID)"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
  KeyAndFillTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NativeTests
      - path: UITests/StudioViewportGeometry.swift
    dependencies:
      - target: KeyAndFill
      - package: LightingCore
        product: LightingCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.keyandfill.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KeyAndFill.app/KeyAndFill"
        BUNDLE_LOADER: "$(TEST_HOST)"
  KeyAndFillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: KeyAndFill
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.keyandfill.uitests
schemes:
  KeyAndFill:
    build:
      targets:
        KeyAndFill: all
    test:
      targets:
        - KeyAndFillTests
        - KeyAndFillUITests
    run:
      config: Debug
